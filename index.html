<style>
:root{
  color-scheme: dark;
  --bg:#0B0C0E; --panel:#151619; --panel-2:#1B1D21; --line:#26282D;
  --ink:#F3F3F1; --sub:#9A9CA3; --sub-2:#6E7077;
  --c-coral:#FF6B57; --c-gold:#FFB84D; --c-teal:#4DD9C0; --c-blue:#5B8CFF; --c-purple:#B96BFF; --c-pink:#FF6FA5;
  --spectrum: linear-gradient(90deg,var(--c-coral),var(--c-gold),var(--c-teal),var(--c-blue),var(--c-purple),var(--c-pink));
  --maxw:1280px; --max:820px;
}
*{box-sizing:border-box; margin:0; padding:0;}
html{scroll-behavior:smooth;}
body{
  background:var(--bg); color:var(--ink); font-family:'IBM Plex Mono',monospace; font-size:15.5px; line-height:1.65;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--c-blue); color:#0B0C0E;}
a{color:inherit; text-decoration:none;}
button{font-family:inherit; cursor:pointer; background:none; border:none; color:inherit;}
:focus-visible{outline:2px solid var(--c-blue); outline-offset:3px;}
h1,h2,h3,h4{font-family:'Space Grotesk',sans-serif; font-weight:600; letter-spacing:-0.01em;}
p{margin:0 0 1em; max-width:60ch; color:var(--sub);}
p:last-child{margin-bottom:0;}
.wrap{max-width:var(--maxw); margin:0 auto; padding:0 40px;}
.narrow{max-width:var(--max); margin:0 auto; padding:0 40px;}
.label{font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:.06em; color:var(--sub);}
.grad-text{background:var(--spectrum); -webkit-background-clip:text; background-clip:text; color:transparent;}
@media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms !important; animation-iteration-count:1 !important;} }

/* ---------- NAV ---------- */
.spectrum-bar{height:4px; width:100%; background:var(--spectrum); position:relative; z-index:40;}
header.site{position:sticky; top:0; z-index:39; background:rgba(11,12,14,0.88); backdrop-filter:blur(8px); border-bottom:1px solid var(--line);}
.nav-inner{display:flex; align-items:center; justify-content:space-between; padding:20px 40px; max-width:var(--maxw); margin:0 auto;}
.wordmark{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:16px; letter-spacing:-0.01em;}
nav.links{display:flex; gap:26px; align-items:center;}
nav.links button.navlink{font-family:'IBM Plex Mono',monospace; font-size:13px; color:var(--sub); padding:4px 0; border-bottom:1px solid transparent;}
nav.links button.navlink:hover, nav.links button.navlink.active{color:var(--ink); border-color:var(--c-blue);}

/* ---------- PAGES ---------- */
.page{display:none;}
.page.active{display:block;}
section{padding:90px 0;}
section.tight{padding:56px 0;}
.hr{border:none; border-top:1px solid var(--line);}

/* ---------- HERO (3D pinned) ---------- */
.pin-section{position:relative; height:200vh;}
.pin-inner{position:sticky; top:0; height:100vh; overflow:hidden;}
#sceneHolder{position:absolute; inset:0; z-index:1;}
#sceneHolder canvas{display:block; width:100%; height:100%;}
.scrim{position:absolute; inset:0; z-index:2; background:radial-gradient(ellipse at 30% 45%, rgba(11,12,14,0.02), rgba(11,12,14,0.58) 78%); pointer-events:none;}
.overlay{position:absolute; inset:0; z-index:3; display:flex; align-items:center; padding:0 40px;}
.overlay .inner-wrap{max-width:var(--maxw); margin:0 auto; width:100%;}
.text-panel{background:rgba(11,12,14,0.6); backdrop-filter:blur(3px); border:1px solid var(--line); border-radius:18px; padding:38px 42px; max-width:640px;}
#heroOverlay{opacity:1;}
h1.hero-h{font-size:clamp(34px,5.6vw,72px); line-height:1.04; letter-spacing:-0.02em; margin-top:16px;}
.lede{font-family:'IBM Plex Mono',monospace; font-size:15px; color:var(--sub); max-width:46ch; margin-top:22px;}
.scroll-cue{position:absolute; bottom:34px; left:40px; z-index:3; font-size:11px; color:var(--sub); display:flex; align-items:center; gap:8px;}
.arrow-down{display:inline-block; animation:bob 1.6s ease-in-out infinite;}
@keyframes bob{0%,100%{transform:translateY(0);}50%{transform:translateY(5px);}}
.reduced-note{position:fixed; bottom:14px; left:14px; z-index:50; font-size:10.5px; color:var(--sub); background:var(--panel); border:1px solid var(--line); padding:8px 12px; border-radius:6px; display:none;}

/* ---------- SELECTED WORK / TAG FILTER ---------- */
.filter-row{display:flex; flex-wrap:wrap; gap:10px; margin:26px 0 30px;}
.tag-chip{font-size:11.5px; padding:8px 14px; border-radius:100px; border:1px solid var(--line); color:var(--sub); transition:all .15s ease;}
.tag-chip[data-active="true"]{color:#0B0C0E; border-color:transparent;}
.tag-chip:hover{color:var(--ink); border-color:var(--sub-2);}

.case-grid{display:grid; grid-template-columns:1fr 1fr; gap:22px;}
@media (max-width:820px){.case-grid{grid-template-columns:1fr;}}
.case-card{
  --a:var(--c-coral);
  background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:34px;
  display:flex; flex-direction:column; gap:16px; min-height:250px; text-align:left; position:relative; overflow:hidden;
  transition:transform .2s ease, border-color .2s ease;
}
.case-card::before{content:''; position:absolute; top:-60%; right:-30%; width:70%; height:200%; background:var(--a); opacity:.16; filter:blur(30px); border-radius:50%; pointer-events:none;}
.case-card:hover{transform:translateY(-4px); border-color:var(--a);}
.case-card.hidden-by-filter{display:none;}
.case-card .top{display:flex; justify-content:space-between; align-items:flex-start; position:relative; z-index:1;}
.case-card .company{font-size:11.5px; color:var(--a); letter-spacing:.05em;}
.case-card .idx{font-family:'Space Grotesk',sans-serif; font-size:13px; color:var(--sub-2);}
.case-card h3{font-family:'Space Grotesk',sans-serif; font-size:23px; line-height:1.18; position:relative; z-index:1; color:var(--ink);}
.case-card .signal-line{font-size:13.5px; color:var(--sub); position:relative; z-index:1;}
.case-card .tags{display:flex; flex-wrap:wrap; gap:6px; position:relative; z-index:1;}
.case-card .tags span{font-size:10px; padding:4px 9px; border-radius:100px; border:1px solid var(--line); color:var(--sub);}
.case-card .open{margin-top:auto; font-size:12.5px; color:var(--ink); display:flex; align-items:center; gap:6px; position:relative; z-index:1;}
.case-card .open::after{content:'→'; transition:transform .15s ease;}
.case-card:hover .open::after{transform:translateX(4px);}

/* featured (Solink) */
.featured{margin-top:22px; border:1px dashed var(--line); border-radius:16px; padding:28px; background:var(--panel-2); display:flex; gap:20px; align-items:flex-start;}
.featured .dot{width:10px; height:10px; border-radius:50%; background:var(--c-teal); margin-top:6px; flex-shrink:0;}
.featured h3{font-size:18px; margin-bottom:6px;}
.featured .open{color:var(--c-teal); font-size:12.5px;}
@media (max-width:600px){.featured{flex-direction:column;}}

/* ---------- ABOUT TEASER ---------- */
.about-teaser{display:grid; grid-template-columns:1fr 1fr; gap:56px; align-items:start;}
@media (max-width:760px){.about-teaser{grid-template-columns:1fr;}}

/* ---------- CASE STUDY PAGE ---------- */
.case-hero{position:relative; padding:70px 0 50px; overflow:hidden;}
.case-hero .glow{position:absolute; top:-30%; left:-10%; width:60%; height:160%; border-radius:50%; filter:blur(60px); opacity:.28; z-index:0;}
.case-hero .glow2{position:absolute; bottom:-40%; right:-15%; width:50%; height:140%; border-radius:50%; filter:blur(70px); opacity:.18; z-index:0;}
.case-hero .inner{position:relative; z-index:1;}
.cover-strip{display:flex; flex-wrap:wrap; gap:10px 28px; margin:22px 0 6px; padding:18px 22px; background:var(--panel); border:1px solid var(--line); border-radius:14px;}
.cover-strip div{font-size:12.5px; color:var(--sub);}
.cover-strip div b{color:var(--ink); display:block; font-family:'Space Grotesk',sans-serif; font-size:14px; margin-bottom:2px; font-weight:500;}
.case-hero h1{font-size:clamp(28px,4.2vw,46px); margin-top:16px;}
.case-hero .tags{display:flex; flex-wrap:wrap; gap:8px; margin-top:18px;}
.case-hero .tags span{font-size:11px; padding:6px 12px; border-radius:100px; border:1px solid var(--line); color:var(--sub);}

.case-body{padding:20px 0 90px; max-width:var(--max); margin:0 auto;}
.case-section{margin-bottom:52px;}
.case-section h2{font-size:22px; margin-bottom:16px; color:var(--ink);}
.case-section h4{font-size:15px; margin:20px 0 8px; color:var(--ink);}
.case-section ul{margin:0 0 1em; padding-left:20px; max-width:58ch; color:var(--sub);}
.case-section li{margin-bottom:6px;}
.callout{border-left:3px solid var(--accent); padding:8px 0 8px 22px; margin:26px 0; font-family:'Space Grotesk',sans-serif; font-size:19px; font-weight:500; color:var(--ink); max-width:54ch;}
.note{background:var(--panel); border:1px solid var(--line); padding:16px 20px; border-radius:12px; font-size:13.5px; color:var(--sub); max-width:60ch; margin:18px 0;}
.note b{color:var(--ink);}

.diagram{background:var(--panel); border:1px solid var(--line); border-left:3px solid var(--accent); border-radius:12px; padding:26px 24px; margin:20px 0 6px;}
.diagram .dtitle{font-size:11.5px; color:var(--accent); margin-bottom:16px; letter-spacing:.04em;}
.recon-tag{font-size:11px; color:var(--sub-2); margin-top:8px;}
.flow{display:flex; flex-wrap:wrap; align-items:center; gap:0;}
.flow .step{background:var(--panel-2); border:1px solid var(--line); border-radius:8px; padding:10px 14px; font-size:12px; text-align:center; line-height:1.35; max-width:170px; color:var(--sub);}
.flow .arrow{color:var(--sub-2); padding:0 8px; font-size:15px;}
.flow.vertical{flex-direction:column; align-items:flex-start;}
.flow.vertical .arrow{padding:6px 0 6px 18px;}
.flow.vertical .step{max-width:420px; width:100%;}

.contrast{display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--line); border:1px solid var(--line); border-radius:12px; overflow:hidden; margin:20px 0;}
@media (max-width:640px){.contrast{grid-template-columns:1fr;}}
.contrast > div{background:var(--panel); padding:22px;}
.contrast .ctitle{font-size:11px; margin-bottom:8px; letter-spacing:.04em;}
.contrast .before .ctitle{color:var(--sub-2);}
.contrast .after .ctitle{color:var(--accent);}
.contrast p{font-size:14.5px; margin:0; color:var(--sub);}

.metric-row{display:flex; flex-wrap:wrap; gap:36px; margin:18px 0;}
.metric{min-width:130px;}
.metric .num{font-family:'Space Grotesk',sans-serif; font-size:32px; font-weight:600; color:var(--ink); display:flex; align-items:baseline; gap:8px;}
.metric .num .arrow{color:var(--accent); font-size:22px;}
.metric .cap{font-size:11px; color:var(--sub-2); margin-top:4px;}

.queue-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:18px 0;}
@media (max-width:640px){.queue-grid{grid-template-columns:1fr 1fr;}}
.queue-tag{border:1px solid var(--line); border-radius:8px; padding:12px; font-size:11.5px; color:var(--sub); text-align:center;}

.case-nav-footer{display:flex; justify-content:space-between; margin-top:60px; border-top:1px solid var(--line); padding-top:24px;}
.case-nav-footer button{font-size:12.5px; color:var(--sub);}
.case-nav-footer button:hover{color:var(--accent);}

/* ---------- ABOUT PAGE ---------- */
.about-hero{padding:80px 0 20px;}
.about-hero h1{font-size:clamp(36px,6vw,64px); line-height:1.05;}
.about-hero .rule{height:2px; width:64px; background:var(--spectrum); margin:26px 0 0; border-radius:2px;}
.about-body{max-width:var(--max); margin:0 auto; padding:20px 0 90px;}
.about-body p{font-size:16.5px; color:#c7c8cd; max-width:62ch;}
.about-body .big-line{font-family:'Space Grotesk',sans-serif; font-size:22px; font-weight:500; color:var(--ink); margin:34px 0; max-width:22ch;}
.about-body .closer{font-family:'Space Grotesk',sans-serif; font-size:30px; margin-top:50px;}

/* ---------- FOOTER / CONTACT ---------- */
footer.site{border-top:1px solid var(--line); padding:56px 0 44px;}
.footer-grid{display:flex; justify-content:space-between; flex-wrap:wrap; gap:24px; align-items:flex-end;}
footer.site a.contact-link{font-family:'Space Grotesk',sans-serif; font-size:19px; text-decoration:none;}
footer.site a.contact-link:hover{color:var(--c-blue);}
footer.site .li-link{font-size:12.5px; color:var(--sub); text-decoration:underline; text-underline-offset:3px;}
footer.site .li-link:hover{color:var(--ink);}
</style>

<script>
/* ================= helpers ================= */
function flow(steps, vertical){
  const arrow = vertical ? '↓' : '→';
  return `<div class="flow ${vertical?'vertical':''}">` +
    steps.map((s,i)=>`<div class="step">${s}</div>${i<steps.length-1?`<div class="arrow">${arrow}</div>`:''}`).join('') +
    `</div>`;
}
function diagram(title, inner, reconLabel){
  return `<div class="diagram"><div class="dtitle">${title}</div>${inner}</div>
  <div class="recon-tag">${reconLabel || 'Reconstructed for portfolio purposes — not an original company artifact.'}</div>`;
}
function contrast(beforeTitle, beforeText, afterTitle, afterText){
  return `<div class="contrast">
    <div class="before"><div class="ctitle">${beforeTitle}</div><p>${beforeText}</p></div>
    <div class="after"><div class="ctitle">${afterTitle}</div><p>${afterText}</p></div>
  </div>`;
}
function metricRow(items){
  return `<div class="metric-row">` + items.map(m=>`
    <div class="metric">
      <div class="num">${m.from?`${m.from}<span class="arrow">→</span>`:''}${m.to}</div>
      <div class="cap">${m.label}</div>
    </div>`).join('') + `</div>`;
}
function queueGrid(items){
  return `<div class="queue-grid">` + items.map(i=>`<div class="queue-tag">${i}</div>`).join('') + `</div>`;
}
function callout(text){ return `<div class="callout">${text}</div>`; }
function note(html){ return `<div class="note">${html}</div>`; }

/* ================= tag taxonomy ================= */
const TAGS = ['Escalation Design','Onboarding & Readiness','Coaching & Mentorship','Knowledge Systems','AI-Enabled Support','Program Leadership'];
const TAG_COLORS = {
  'Escalation Design':'var(--c-coral)',
  'Onboarding & Readiness':'var(--c-gold)',
  'Coaching & Mentorship':'var(--c-pink)',
  'Knowledge Systems':'var(--c-teal)',
  'AI-Enabled Support':'var(--c-blue)',
  'Program Leadership':'var(--c-purple)'
};

/* ================= content: case studies ================= */
const CASES = [
{
  id:'case-01', num:'01', accent:'var(--c-coral)', company:'Shopify', role:'Escalated Support Lead', timeframe:'Regional Support pilot era',
  title:'Building Canada\'s Regional Tier 2 Support Model',
  signal:'Designed the escalation workflows, coaching, knowledge, and frontline enablement behind a specialized regional Support model for Canada.',
  tags:['Escalation Design','Coaching & Mentorship','Program Leadership'],
  cover:{ problem:'Regionalized Support needed an escalation model that fixed a trust problem, not just a workflow.', result:'Canada became Shopify\'s highest-performing regional Support team.' },
  meta:{ audience:'~4 frontline teams (10–12 advisors each) and their Team Leads' },
  body: `
    <div class="case-section">
      <h2>The setup</h2>
      <p>Shopify was regionalizing Support: giving regions dedicated teams with deeper knowledge of their own market instead of a single undifferentiated queue. Canada operated close to a white-glove model, with frontline and escalated Support both dedicated to the region.</p>
      <p>I'd been a specialist in an earlier New York regionalization pilot and a later Escalated Support pilot. When Shopify revisited regionalization, that pilot experience — and my progression into leadership — put me in the seat as the sole Escalated Support Lead representing Tier 2 in the Canadian region.</p>
      <p>Regionalizing meant designing the operating model from close to nothing: escalation criteria, queue staffing, KPIs, quality review, how knowledge gaps got documented, and how Team Leads could request development for their teams.</p>
      ${note('<b>What I owned:</b> the Tier 2 side of the model — escalation policy, queue design, Zendesk workflow, KPIs, QA participation, and the learning system built around it. Regionalization itself was a company-wide initiative I contributed one region\'s Tier 2 design to, not something I ran alone.')}
    </div>

    <div class="case-section">
      <h2>The problem underneath the problem</h2>
      <p>The stated task was operational: build an escalation model. The real constraint was human. Frontline Support Advisors were sometimes intimidated by Tier 2 — inclined to see them as the group that judged or rejected escalations rather than a resource that existed to help them get stronger.</p>
      <p>That perception mattered because it changed behavior: advisors who felt judged escalated less confidently, later, or not at all — even when they should have.</p>
      ${callout('Improving the escalation process and improving the relationship between the two groups turned out to be the same problem.')}
    </div>

    <div class="case-section">
      <h2>What I built</h2>
      <p>We stood up dedicated Zendesk mechanisms for regional escalations — channels, tags, and workflows — with defined "goalie" shifts for monitoring incoming demand, and ticket, CSAT, and quality expectations for specialists managing the queue. When an escalation didn't meet the bar, there was a path to return it to the originating advisor for coaching, rather than Tier 2 just absorbing the problem — and we tracked how often that happened.</p>
      ${diagram('Regional escalation model', flow(['Canadian merchant','Frontline Support','Tier 2 escalation']) + `<div style="margin-top:14px; font-size:13px; color:var(--sub);">Surrounded by: training, coaching, mentorship, knowledge management, Q&amp;A, and escalation feedback — not just a handoff.</div>`)}
      <h4>The learning layer</h4>
      <p>Team Leads got a structured booking system to request development time for their teams — capturing the Team Lead, team, scheduled time, requested topic, and questions the team wanted addressed in advance. Collecting questions ahead of time let specialists prepare and make the most of limited off-channel time.</p>
      <p>Topics were driven by what was actually happening: escalation patterns, Team Lead requests, specialist observations, QA, and recurring merchant issues. Example topics included what a good escalation looks like, what troubleshooting is expected before escalating, and how to investigate common complex issues more effectively.</p>
      ${diagram('Team Lead learning request flow', flow(['Team Lead identifies need','Books team time','Selects topic','Team submits questions','Specialist assigned &amp; prepares','Session delivered','Ongoing coaching / mentorship'], true))}
      <p>Development wasn't limited to formal sessions — it also ran through 1:1 coaching, live troubleshooting, mentorship pairing senior and junior specialists, knowledge resources, and structured feedback after unsuccessful escalations.</p>
    </div>

    <div class="case-section">
      <h2>The insight that mattered most</h2>
      <p>Repeated, lower-stakes interaction between Tier 2 and frontline Support — training, Q&amp;A, mentorship — did more than transfer knowledge. It made specialists into people advisors recognized, rather than a wall they only met when something had gone wrong.</p>
      ${contrast('BEFORE', 'Tier 2 as gatekeeper — the team that reviews and often rejects escalations.', 'AFTER', 'Tier 2 as teacher, specialist, and partner — a resource advisors actually wanted to learn from.')}
      <p>As familiarity grew, so did frontline confidence — in what to escalate, and in their own troubleshooting before they got there.</p>
    </div>

    <div class="case-section">
      <h2>What happened</h2>
      <p>The Canadian region became Shopify's highest-performing regional Support team during this period. Exact historical figures from this era weren't retained, so these are presented directionally rather than as precise numbers:</p>
      <ul>
        <li>Shorter customer wait and resolution times</li>
        <li>Higher CSAT and improved solve rates</li>
        <li>Reduced and higher-quality escalation volume</li>
        <li>Noticeably greater frontline confidence engaging with Tier 2</li>
      </ul>
      <p>The learning and booking infrastructure was specific to the Canadian implementation — it didn't exist in that form in Core Escalated Support. The shift in framing mattered: instead of treating Tier 2 purely as a destination for hard tickets, we used specialist expertise as a standing development resource for frontline teams.</p>
    </div>

    <div class="case-section">
      <h2>What I'd do differently now</h2>
      <p>Most of the administration and measurement was manual. With today's tools, I'd automate the booking, routing, follow-up, and measurement workflows; build real data infrastructure connecting learning interventions to the performance that followed; and design in more sustained, structured interaction between Tier 2 and frontline Support — not just around escalation events.</p>
    </div>
  `
},
{
  id:'case-02', num:'02', accent:'var(--c-gold)', company:'ThriveCart', role:'Support Operations Lead', timeframe:'Fall/Winter 2023 →',
  title:'Building a Tier 1 Support Program From Zero',
  signal:'Built the learning and readiness program for a new 20-seat frontline Support team, helping reduce average first-response time from roughly six days to one hour.',
  tags:['Onboarding & Readiness','Escalation Design','Program Leadership'],
  cover:{ problem:'~6-day first response, an overloaded Tier 2, and a mandate for a 12-hour response.', result:'First response cut to ~1 hour; NPS rose from -12 to +64.' },
  meta:{ audience:'Newly hired Tier 1 specialists, onboarded in the Philippines in waves of ~8' },
  body:`
    <div class="case-section">
      <h2>The setup</h2>
      <p>Before this program, average first response time was around six days. NPS sat near -12, and CSAT generally averaged in the 80s. Senior Tier 2 specialists were absorbing tickets that were too complex for the bot but didn't need senior expertise — leaving little room for the deep investigations that actually needed them.</p>
      <p>The CEO's target was a 12-hour first response on every ticket, including ones that would ultimately need deeper senior investigation. I proposed outsourcing Tier 1 as the operating model to get there, and owned the resulting program end to end: hiring, onboarding architecture, readiness requirements, Zendesk configuration, and much of the knowledge management. Tier 2 specialists co-created some training material and delivered most of the day-to-day instruction, grading, and mentoring.</p>
    </div>

    <div class="case-section">
      <h2>Hiring was the first readiness gate</h2>
      <p>I wrote the postings, ran interviews, made offers, and used a two-week paid contract as both onboarding and a practical readiness assessment — not everyone who started that period moved into a full-time seat. We onboarded in waves of about eight until all 20 seats were filled.</p>
      <p>The role needed more than product knowledge: written English, customer communication, troubleshooting instinct, confidence, resourcefulness, reliability, and the judgment to know when to keep digging versus escalate.</p>
      ${diagram('Two-week learner journey', flow(['Recruit &amp; interview','2-week contract / onboarding','Daily instruction + practice','Assignments &amp; knowledge checks','Ticket-based application','Grading &amp; coaching','Readiness review','Full-time placement'], true))}
    </div>

    <div class="case-section">
      <h2>Design principle: judgment over memorization</h2>
      <p>The goal was never to teach every possible answer. It was enough product knowledge, troubleshooting ability, and resourcefulness for specialists to find answers themselves and know when senior expertise was genuinely required.</p>
      ${callout('Teach them to fish — not hand them a longer list of answers to memorize.')}
      <p>Content changed continuously based on what real tickets surfaced: product knowledge, handling customers already frustrated by long waits, written communication, confidence, escalation judgment, and — notably — documentation gaps, since a lot of institutional knowledge lived only in senior specialists' heads.</p>
    </div>

    <div class="case-section">
      <h2>The escalation architecture</h2>
      <p>I personally built the Zendesk workflow behind Tier 1 — macros, routing, views, tags, access, and the process around it — plus the knowledge resources defining what a good escalation looks like, when to escalate, and how notes should be structured.</p>
      ${diagram('Escalation workflow', flow(['Tier 1 gathers required info','Basic troubleshooting completed','Escalate via macro (if justified)','Tier 2 receives full context','Tier 2 owns deeper investigation','Feedback &amp; new knowledge flow back']))}
      <p>The goal wasn't just moving tickets between teams — it was improving the quality of the handoff and progressively building Tier 1 judgment.</p>
    </div>

    <div class="case-section">
      <h2>How readiness was decided</h2>
      <p>Learners were evaluated on assignments, knowledge checks, ticket work, grading, QA, communication, troubleshooting behavior, and reliability. At the end of each two-week period, I reviewed every candidate with the Tier 2 specialists who'd been developing them — asking how they were doing, whether they were ready, and what evidence supported that call. Completion never equaled readiness on its own.</p>
    </div>

    <div class="case-section">
      <h2>Results</h2>
      ${metricRow([
        {from:'~6 days', to:'~1 hour', label:'AVERAGE FIRST RESPONSE'},
        {to:'20 seats', label:'TIER 1 BUILT FROM ZERO'},
        {from:'-12', to:'+64', label:'NPS, FOLLOWING YEAR'}
      ])}
      <p>Tier 2 regained capacity for complex investigations, deeper product work, and operational improvement instead of carrying the full frontline queue. NPS moved from roughly -12 to +36 quarter-over-quarter, and to roughly +64 the following year — though that shift also reflects broader customer-experience work, including refund and sentiment analysis that surfaced product issues, not the Tier 1 program alone.</p>
    </div>

    <div class="case-section">
      <h2>What I'd carry forward</h2>
      <p>Building a learning program means building the whole environment around the learner — scope, useful knowledge, escalation pathways, SME relationships, practice, feedback, and a real definition of readiness. And experienced specialists become powerful learning multipliers the moment you deliberately bring them into training, mentoring, and assessment — not just senior ticket work.</p>
    </div>
  `

      <p>I described the concerns and KPIs that actually mattered and asked it to scan available processes and organize the queue accordingly. Useful categories emerged on their own:</p>

      <p>The value is prioritization, not summarization — a much more useful question than "what's in my queue" is "what do I need to drop everything for right now."</p>

      <p>Mid-call, it can search relevant Slack discussion for how other specialists handled a similar case — especially valuable in Accounting, where a lot of practical knowledge lives only in specialist Slack threads. It also drafts customer emails, structures call notes to Clio's standards, and summarizes case history — reducing retrieval and formatting work, not the judgment around it.</p>

      <h2>Human-in-the-loop, by design</h2>
      <p>Nothing is assumed correct. The operating model is retrieve → synthesize → recommend → verify → decide → act — I challenge outputs, ask for fact-checks against internal resources, and explicitly instruct it not to guess when evidence isn't there. The decision, and the customer outcome, stay mine.</p>

    ${note('I joined Shopify\'s existing Junior Support Advisor (JSA) program as a mentor and was later promoted to Team Lead — I didn\'t create the overall program, but I owned significant parts of how it worked in practice.')}
    <div class="case-section">
      <h2>The setup</h2>
      <p>JSA was an entry pathway into Support for people early in their careers. Roughly 200 people moved through the broader cohort-based program, progressing over about three months before graduation eligibility:</p>
      ${diagram('The pathway', flow(['Junior Support Advisor','Chat Support','Increasing independence','Phone training','Sustained phone performance','Graduation assessment','Core Support Advisor']))}
      <p>Time in the program never guaranteed progression. Graduation had to be earned.</p>
    </div>

    <div class="case-section">
      <h2>What "ready" actually meant</h2>
      <p>Readiness combined quantitative performance, observed behavior, critical-process adherence, and professional reliability. Approximate historical benchmarks (from memory, treated as directional rather than exact) included managing three simultaneous chats, CSAT above roughly 90%, adherence above roughly 82%, completed phone training, about three weeks of sustained phone performance, sound escalation judgment, and consistent customer-authentication compliance.</p>
      <div class="callout">Customer authentication sat in its own category. A strong metrics profile didn't matter if authentication wasn't reliable — that required immediate intervention, not developmental coaching.</div>
      <p>Readiness also wasn't only technical. Some advisors were early in their careers and needed direct coaching on foundational workplace expectations — punctuality, attendance, reliability. The underlying question was always the same: can the operation depend on this person to do the job consistently?</p>
    </div>

    <div class="case-section">
      <h2>Making expert behavior visible</h2>
      <p>As a mentor, I ran team coaching, QA, live Slack support, shadowing, and specialist education — around 80–110 QA ticket reviews a month for each assigned advisor. JSAs didn't have direct access to Shopify's escalated Support teams, so mentors sat in the middle:</p>
      ${diagram('Escalation learning loop', flow(['JSA identifies issue','Mentor reviews','Redirect to troubleshoot — or —','Mentor escalates to specialist','JSA observes the interaction','JSA sees what a strong escalation looks like'], true))}
      <p>On Slack goalie shifts, the job usually wasn't to hand over the answer — it was redirecting: <em>"this isn't an escalation yet, go investigate this first."</em> That built resourcefulness instead of dependence.</p>
    </div>

    <div class="case-section">
      <h2>Two interventions I built myself</h2>
      <h4>Risk Support education</h4>
      <p>Drawing on earlier Risk Support pilot experience, I built learning resources on when Risk involvement was required, what a good Risk escalation looked like, and how to handle chargebacks, KYC workflows, and price-gouging reports — expectations that were traditionally only learned through live-channel experience.</p>
      <h4>Workplace-language coaching</h4>
      <p>Many JSAs were adapting to Canadian workplace communication while learning Support itself — struggling less with English and more with idiom, tone, and emotionally charged customer language. Drawing on a TESOL background, I built coaching that used real Support conversations as the material:</p>
      ${diagram('Workplace-language coaching pattern', flow(['This is how you answered','This is what the customer likely meant','Here is how I would respond','Here is why that wording works better here']))}
      <p>The goal was never grammatical correctness — it was confident, accurate communication under real customer stress.</p>
    </div>

    <div class="case-section">
      <h2>As Team Lead</h2>
      <p>Promotion added 1:1 coaching, performance management, live chat and call observation, real-time coaching mid-interaction, and — ultimately — the graduation decision for my assigned advisors. That decision had to be evidence-backed: metrics, phone performance, troubleshooting, escalation judgment, reliability, and critical-process adherence, reviewed regularly with senior leadership.</p>
      ${contrast('THE WRONG QUESTION', 'Did they finish the program?', 'THE RIGHT QUESTION', 'Can I responsibly say this person is ready to do the job safely, reliably, and independently?')}
      <p>I also led a project to formally define the JSA program itself — its purpose, its North Star, and what graduation actually represented — making its value visible beyond the teams running it day to day.</p>
    </div>

    <div class="case-section">
      <h2>What it reinforced</h2>
      <p>Not every competency carries equal weight. Communication, troubleshooting, and confidence develop through coaching and practice. Critical processes like authentication need consistent execution because the cost of failure is categorically higher — and they need a different kind of monitoring and intervention. These principles reappeared directly in the Canadian regionalization and ThriveCart programs that came later.</p>
    </div>
  `

const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
if(reduceMotion){ document.getElementById('reducedNote').style.display='block'; }
let heroScene = null;

function initHeroScene(){
  const holder = document.getElementById('sceneHolder');
  if(!holder) return;
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, holder.clientWidth/holder.clientHeight, 0.1, 100);
  camera.position.set(0,0,9);

  const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 1.75));
  renderer.setSize(holder.clientWidth, holder.clientHeight);
  if(renderer.outputEncoding !== undefined) renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.15;
  holder.appendChild(renderer.domElement);

  scene.add(new THREE.AmbientLight(0x40424c, 1.1));
  const key = new THREE.PointLight(0xff6b57, 40, 34); key.position.set(4,3,6); scene.add(key);
  const fillL = new THREE.PointLight(0x5b8cff, 36, 34); fillL.position.set(-5,-2,4); scene.add(fillL);
  const rim = new THREE.PointLight(0x4dd9c0, 24, 34); rim.position.set(0,5,-4); scene.add(rim);
  const kick = new THREE.PointLight(0xffb84d, 20, 30); kick.position.set(2,-4,2); scene.add(kick);

  const group = new THREE.Group(); scene.add(group);
  const forms = [];
  const disposables = [];
  const specs = [
    {geo:new THREE.IcosahedronGeometry(1.5,1), color:0xFF6B57, metalness:0.25, roughness:0.35, pos:[-2.1,0.5,0]},
    {geo:new THREE.TorusKnotGeometry(0.85,0.26,120,16), color:0x5B8CFF, metalness:0.4, roughness:0.28, pos:[2.0,-0.5,-1]},
    {geo:new THREE.SphereGeometry(0.8,48,48), color:0xFFB84D, metalness:0.15, roughness:0.55, pos:[0.5,1.6,-2]},
    {geo:new THREE.TorusGeometry(0.65,0.2,32,100), color:0xB96BFF, metalness:0.3, roughness:0.32, pos:[-1.0,-1.7,-1.5]}
  ];
  specs.forEach(s=>{
    const mat = new THREE.MeshStandardMaterial({
      color:s.color, metalness:s.metalness, roughness:s.roughness,
      emissive:new THREE.Color(s.color), emissiveIntensity:0.28
    });
    const mesh = new THREE.Mesh(s.geo, mat);
    mesh.position.set(s.pos[0], s.pos[1], s.pos[2]);
    group.add(mesh); forms.push(mesh);
    disposables.push(s.geo, mat);
  });

  function onResize(){
    if(!holder.isConnected) return;
    camera.aspect = holder.clientWidth / holder.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(holder.clientWidth, holder.clientHeight);
    renderer.render(scene, camera);
  }
  window.addEventListener('resize', onResize);
  onResize();
  renderer.render(scene, camera);

  // mutable state object so disposal always cancels the CURRENT pending frame,
  // not a stale snapshot of the id (this was the source of the crash: repeated
  // navigation left old render loops running because the wrong id was cancelled).
  const state = { rafId:null, stopped:false };
  function animate(){
    if(state.stopped) return;
    forms.forEach((m,i)=>{ m.rotation.x += 0.0014*(i+1); m.rotation.y += 0.002*(i+1); });
    renderer.render(scene, camera);
    state.rafId = requestAnimationFrame(animate);
  }
  if(!reduceMotion) state.rafId = requestAnimationFrame(animate);

  let st = null;
  if(!reduceMotion && window.gsap && window.ScrollTrigger){
    gsap.registerPlugin(ScrollTrigger);
    const tl = gsap.timeline({
      scrollTrigger:{ trigger:'#pinSection', start:'top top', end:'bottom bottom', scrub:0.6 }
    });
    tl.to(forms[0].position, {x:-3.4, y:1.3, z:1}, 0)
      .to(forms[1].position, {x:3.1, y:0.7, z:-2}, 0)
      .to(forms[2].position, {x:1.5, y:-1.5, z:0.4}, 0)
      .to(forms[3].position, {x:-1.1, y:-2.2, z:-1}, 0)
      .to(group.rotation, {y:Math.PI*0.32}, 0)
      .to('#heroOverlay', {opacity:0, y:-24, duration:0.3}, 0.55)
      .to('.scroll-cue', {opacity:0, duration:0.2}, 0.1);
    st = tl.scrollTrigger;
  }

  heroScene = {renderer, onResize, disposables, state, scrollTrigger:st};
}

function disposeHeroScene(){
  if(!heroScene) return;
  // stop the render loop FIRST so nothing tries to render mid-teardown
  heroScene.state.stopped = true;
  if(heroScene.state.rafId) cancelAnimationFrame(heroScene.state.rafId);
  try{
    // kill every ScrollTrigger, not just the one we tracked — a safety net in
    // case a prior instance's trigger wasn't fully released
    if(window.ScrollTrigger){ ScrollTrigger.getAll().forEach(t=>t.kill()); }
  }catch(e){}
  window.removeEventListener('resize', heroScene.onResize);
  try{
    heroScene.disposables.forEach(d=>{ if(d && typeof d.dispose === 'function') d.dispose(); });
  }catch(e){}
  try{
    heroScene.renderer.dispose();
    if(heroScene.renderer.forceContextLoss) heroScene.renderer.forceContextLoss();
  }catch(e){}
  if(heroScene.renderer.domElement && heroScene.renderer.domElement.parentNode){
    heroScene.renderer.domElement.parentNode.removeChild(heroScene.renderer.domElement);
  }
  heroScene = null;
}

/* ================= router ================= */
const app = document.getElementById('app');
let activeTags = new Set();

function findCase(id){ return CASES.find(c=>c.id===id); }

function updateFilterUI(){
  document.querySelectorAll('.tag-chip').forEach(chip=>{
    const t = chip.getAttribute('data-tag');
    const isAll = t==='__all';
    const active = isAll ? activeTags.size===0 : activeTags.has(t);
    if(active && !isAll){
      chip.style.background = TAG_COLORS[t];
      chip.style.color = '#0B0C0E';
      chip.style.borderColor = 'transparent';
    } else if(active && isAll){
      chip.style.background = 'var(--ink)';
      chip.style.color = '#0B0C0E';
      chip.style.borderColor = 'transparent';
    } else {
      chip.style.background = 'transparent';
      chip.style.color = '';
      chip.style.borderColor = '';
    }
  });
  document.querySelectorAll('#workGrid .case-card[data-tags]').forEach(card=>{
    const tags = card.getAttribute('data-tags').split('|');
    const show = activeTags.size===0 || tags.some(t=>activeTags.has(t));
    card.classList.toggle('hidden-by-filter', !show);
  });
}

function render(page){
  disposeHeroScene();
  activeTags = new Set();
  let html='';
  if(page==='home') html = renderHome();
  else if(page==='work') html = renderWork();
  else if(page==='about') html = renderAbout();
  else if(findCase(page)) html = renderCase(findCase(page));
  else { html = renderHome(); page='home'; }
  app.innerHTML = `<div class="page active">${html}</div>`;
  document.querySelectorAll('nav.links .navlink').forEach(b=>b.classList.remove('active'));
  const navMap = {home:'home', work:'work', about:'about'};
  const navKey = navMap[page] || (findCase(page)?'work':null);
  if(navKey){ const el=document.querySelector(`nav.links .navlink[data-nav="${navKey}"]`); if(el) el.classList.add('active'); }
  window.scrollTo(0,0);
  if(page==='home') initHeroScene();
  if(page==='work') updateFilterUI();
}

function goto(page){ location.hash = page; }

document.addEventListener('click', (e)=>{
  const chip = e.target.closest('.tag-chip');
  if(chip){
    const t = chip.getAttribute('data-tag');
    if(t==='__all'){ activeTags = new Set(); }
    else{ activeTags.has(t) ? activeTags.delete(t) : activeTags.add(t); }
    updateFilterUI();
    return;
  }
  const btn = e.target.closest('[data-goto]');
  if(btn){ e.preventDefault(); goto(btn.getAttribute('data-goto')); return; }
  const navBtn = e.target.closest('[data-nav]');
  if(navBtn){
    e.preventDefault();
    const key = navBtn.getAttribute('data-nav');
    if(key==='contact-scroll'){ document.getElementById('footerContact').scrollIntoView({behavior:'smooth'}); }
    else{ goto(key); }
  }
});
window.addEventListener('hashchange', ()=> render(location.hash.replace('#','')||'home'));
render(location.hash.replace('#','')||'home');
</script>
